<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Financial Pilot AI</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

<!-- LEFT SIDE -->

<div class="col-lg-7 left-panel">

<div>

<h1>Financial Pilot AI</h1>

<p class="subtitle">
Smart Finance.<br>
Smarter Decisions.
</p>

<div class="features">

<p>✔ Expense Tracking</p>

<p>✔ Budget Management</p>

<p>✔ Financial Summary</p>

<p>✔ AI Ready Platform</p>

</div>

</div>

</div>

<!-- RIGHT SIDE -->

<div class="col-lg-5 right-panel">

<div class="login-card">

<h2>Welcome Back</h2>

<p>Login to continue</p>

<div class="mb-3">

<label>Email</label>

<input
type="email"
id="emailInput"
class="form-control"
placeholder="Enter Email">

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
id="passwordInput"
class="form-control"
placeholder="Enter Password">

</div>

<button
id="loginButton"
class="btn btn-primary w-100">

Login

</button>

<div class="text-center mt-4">

<a href="register.html">

Create Account

</a>

</div>

</div>

</div>

</div>

</div>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
