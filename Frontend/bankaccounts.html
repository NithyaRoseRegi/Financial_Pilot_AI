<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bank Accounts - Financial Pilot AI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 bg-dark text-white vh-100 p-3">

            <h3>Financial Pilot AI</h3>

            <hr>

            <a href="dashboard.html"
               class="d-block text-white mb-3 text-decoration-none">
                Dashboard
            </a>

            <a href="bankaccounts.html"
               class="d-block text-white mb-3 text-decoration-none fw-bold">
                Bank Accounts
            </a>

            <a href="expenses.html"
               class="d-block text-white mb-3 text-decoration-none">
                Expenses
            </a>

            <a href="budget.html"
               class="d-block text-white mb-3 text-decoration-none">
                Budget
            </a>

            <a href="summary.html"
               class="d-block text-white mb-3 text-decoration-none">
                Financial Summary
            </a>

            <button class="btn btn-danger w-100 mt-4"
                    onclick="logout()">
                Logout
            </button>

        </div>

        <!-- Main Content -->

        <div class="col-md-10 p-4">

            <h2>Bank Accounts</h2>

            <hr>

            <!-- Add Account Card -->

            <div class="card shadow mb-4">

                <div class="card-header">

                    <h5>Add Bank Account</h5>

                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-3">

                            <label class="form-label">
                                Bank Name
                            </label>

                            <input type="text"
                                   id="bankName"
                                   class="form-control">

                        </div>

                        <div class="col-md-3">

                            <label class="form-label">
                                Account Number
                            </label>

                            <input type="text"
                                   id="accountNumber"
                                   class="form-control">

                        </div>

                        <div class="col-md-3">

                            <label class="form-label">
                                Account Type
                            </label>

                            <select id="accountType"
                                    class="form-select">

                                <option value="Savings">
                                    Savings
                                </option>

                                <option value="Current">
                                    Current
                                </option>

                                <option value="Credit Card">
                                    Credit Card
                                </option>

                            </select>

                        </div>

                        <div class="col-md-3">

                            <label class="form-label">
                                Balance
                            </label>

                            <input type="number"
                                   id="balance"
                                   class="form-control">

                        </div>

                    </div>

                   <button

                        id="saveButton"
                        class="btn btn-primary w-100 mt-5"
                        onclick="saveBankAccount()">

                        Add Account

                    </button>

                </div>

            </div>

            <!-- Bank Account Table -->

            <div class="card shadow">

                <div class="card-header">

                    <h5>Your Bank Accounts</h5>

                </div>

                <div class="card-body">

                    <table class="table table-bordered table-hover">

                        <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>Account Name</th>

                            <th>Account Number</th>

                            <th>Account Type</th>

                            <th>Balance</th>

                            <th>Actions</th>

                        </tr>

                        </thead>

                        <tbody id="bankAccountTable">

                        <!-- JavaScript will insert rows here -->

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/api.js"></script>

<script src="js/bank.js"></script>

</body>

</html>
