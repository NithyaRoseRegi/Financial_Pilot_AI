<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Financial Pilot AI - Budget</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- ================= SIDEBAR ================= -->

        <div class="col-md-2 bg-dark text-white vh-100 p-3">

            <h3>Financial Pilot AI</h3>

            <hr>

            <a href="dashboard.html"
               class="d-block text-white mb-3 text-decoration-none">

                Dashboard

            </a>

            <a href="bankaccounts.html"
               class="d-block text-white mb-3 text-decoration-none">

                Bank Accounts

            </a>

            <a href="expenses.html"
               class="d-block text-white mb-3 text-decoration-none">

                Expenses

            </a>

            <a href="budget.html"
               class="d-block text-white mb-3 text-decoration-none">

                Budget

            </a>

            <a href="summary.html"
               class="d-block text-white mb-3 text-decoration-none">

                Financial Summary

            </a>

            <button
                class="btn btn-danger w-100 mt-4"
                onclick="logout()">

                Logout

            </button>

        </div>


        <!-- ================= MAIN CONTENT ================= -->

        <div class="col-md-10 p-4">

            <h2>Budget Management</h2>

            <hr>


            <!-- ================= BUDGET FORM ================= -->

            <div class="card shadow mb-4">

                <div class="card-header">

                    <h5 class="mb-0">
                        Add / Update Budget
                    </h5>

                </div>

                <div class="card-body">

                    <div class="row">

                        <!-- Month -->

                        <div class="col-md-3 mb-3">

                            <label
                                for="month"
                                class="form-label">

                                Month

                            </label>

                            <select
                                id="month"
                                class="form-select">

                                <option value="1">
                                    January
                                </option>

                                <option value="2">
                                    February
                                </option>

                                <option value="3">
                                    March
                                </option>

                                <option value="4">
                                    April
                                </option>

                                <option value="5">
                                    May
                                </option>

                                <option value="6">
                                    June
                                </option>

                                <option value="7">
                                    July
                                </option>

                                <option value="8">
                                    August
                                </option>

                                <option value="9">
                                    September
                                </option>

                                <option value="10">
                                    October
                                </option>

                                <option value="11">
                                    November
                                </option>

                                <option value="12">
                                    December
                                </option>

                            </select>

                        </div>


                        <!-- Year -->

                        <div class="col-md-3 mb-3">

                            <label
                                for="year"
                                class="form-label">

                                Year

                            </label>

                            <input
                                type="number"
                                id="year"
                                class="form-control">

                        </div>


                        <!-- Amount -->

                        <div class="col-md-4 mb-3">

                            <label
                                for="amount"
                                class="form-label">

                                Budget Amount

                            </label>

                            <input
                                type="number"
                                id="amount"
                                class="form-control"
                                placeholder="Enter budget amount"
                                step="0.01">

                        </div>


                        <!-- Save -->

                        <div class="col-md-2 mb-3 d-flex align-items-end">

                            <button
                                id="saveButton"
                                class="btn btn-primary w-100"
                                onclick="saveBudget()">

                                Add Budget

                            </button>

                        </div>

                    </div>


                    <!-- Cancel Edit -->

                    <button
                        id="cancelButton"
                        class="btn btn-secondary"
                        onclick="clearForm()"
                        style="display:none;">

                        Cancel Edit

                    </button>

                </div>

            </div>


            <!-- ================= BUDGET HISTORY ================= -->

            <div class="card shadow mb-4">

                <div class="card-header">

                    <h5 class="mb-0">
                        Budget History
                    </h5>

                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table
                            class="table table-bordered table-hover">

                            <thead class="table-dark">

                                <tr>

                                    <th>
                                        Month
                                    </th>

                                    <th>
                                        Year
                                    </th>

                                    <th>
                                        Amount
                                    </th>

                                    <th>
                                        Actions
                                    </th>

                                </tr>

                            </thead>

                            <tbody id="budgetTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>


            <!-- ================= SELECTED MONTH SUMMARY ================= -->

            <div class="card shadow">

                <div class="card-header">

                    <h5 class="mb-0">
                        Selected Month Summary
                    </h5>

                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-4">

                            <div class="card">

                                <div class="card-body">

                                    <h6>
                                        Budget
                                    </h6>

                                    <h3 id="budgetValue">
                                        ₹0
                                    </h3>

                                </div>

                            </div>

                        </div>


                        <div class="col-md-4">

                            <div class="card">

                                <div class="card-body">

                                    <h6>
                                        Expenses
                                    </h6>

                                    <h3 id="expenseValue">
                                        ₹0
                                    </h3>

                                </div>

                            </div>

                        </div>


                        <div class="col-md-4">

                            <div class="card">

                                <div class="card-body">

                                    <h6>
                                        Remaining
                                    </h6>

                                    <h3 id="remainingValue">
                                        ₹0
                                    </h3>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- API JS -->

<script src="js/api.js"></script>

<!-- Budget JS -->

<script src="js/budget.js"></script>

</body>

</html>
