<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Financial Pilot AI Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 bg-dark text-white vh-100 p-3">

            <h3>Financial Pilot AI</h3>

            <hr>

            <a href="dashboard.html"
               class="d-block text-white mb-3 text-decoration-none">

                Dashboard

            </a>

            <a href="bankaccounts.html"
               class="d-block text-white mb-3 text-decoration-none">

                Bank Accounts

            </a>

            <a href="expenses.html"
               class="d-block text-white mb-3 text-decoration-none">

                Expenses

            </a>

            <a href="budget.html"
               class="d-block text-white mb-3 text-decoration-none">

                Budget

            </a>

            <a href="FinancialReports.html"
               class="d-block text-white mb-3 text-decoration-none">

                Financial Summary

            </a>

            <button
                    class="btn btn-danger w-100 mt-4"
                    onclick="logout()">

                Logout

            </button>

        </div>

        <!-- Main Content -->

        <div class="col-md-10 p-4">

            <h2>

                Welcome to Financial Pilot AI

            </h2>

            <hr>

            <div class="row mt-4">

                <div class="col-md-4">

                    <div class="card shadow">

                        <div class="card-body">

                            <h5>Total Balance</h5>

                            <h3 id="totalBalance">

                                ₹0

                            </h3>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card shadow">

                        <div class="card-body">

                            <h5>Total Expenses</h5>

                            <h3 id="totalExpenses">

                                ₹0

                            </h3>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card shadow">

                        <div class="card-body">

                            <h5>Remaining Balance</h5>

                            <h3 id="remainingBalance">

                                ₹0

                            </h3>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
